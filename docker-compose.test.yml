services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: yezyy_closure_test
      POSTGRES_PASSWORD: closure_test_only
      POSTGRES_USER: closure_test
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U closure_test -d yezyy_closure_test",
        ]
      interval: 1s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.30.0
    environment:
      MP_ENABLE_CHAOS: "true"
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1::1025"
      - "127.0.0.1::8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 1s
      timeout: 3s
      retries: 30
